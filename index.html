<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolin Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
.avatar{
  width:140px;
  height:140px;
  border-radius:999px;
  object-fit:cover;
  margin-bottom:20px;
  border:2px solid #38bdf8;
}
h1{
  font-size:48px;
  font-weight:700;
  color:#ffffff;
  margin-bottom:12px;
}
.sub{
  color:#94a3b8;
  font-size:18px;
  margin-bottom:32px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:36px;
}
.tag{
  background:#1e293b;
  color:#38bdf8;
  padding:6px 14px;
  border-radius:999px;
  font-size:14px;
}
.links{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  justify-content:center;
}
a{
  color:#38bdf8;
  text-decoration:none;
  border:1px solid #38bdf8;
  padding:10px 20px;
  border-radius:8px;
  transition:0.2s;
}
a:hover{
  background:#38bdf8;
  color:#0f172a;
}
</style>
</head>
<body>
  <img class="avatar" src="./avatar.jpg" alt="avatar">
  <h1>Bolin Lab</h1>
  <p class="sub">Android / Linux 底层开发 | 嵌入式爱好者</p>
  <div class="tags">
    <span class="tag">Android Framework</span>
    <span class="tag">Linux Driver</span>
    <span class="tag">JNI/Native</span>
    <span class="tag">Git</span>
    <span class="tag">C/C++</span>
  </div>
  <div class="links">
    <a href="https://github.com/li2531719785" target="_blank">GitHub</a>
    <a href="mailto:2531719785@qq.com">Email</a>
  </div>
</body>
</html>
