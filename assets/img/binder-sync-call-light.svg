<text x="30" y="378" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#6f746f" text-anchor="start">同步调用没有拿到 BR_REPLY 前，客户端线程一直阻塞；服务端由某个 Binder 线程接活。</text>
