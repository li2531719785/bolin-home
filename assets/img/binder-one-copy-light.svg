<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8532e"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fbf9f3"/>
<text x="24" y="30" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="18" font-weight="700" fill="#15181b" text-anchor="start">为什么叫“一次拷贝”</text>
<text x="24" y="66" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#d8532e" text-anchor="start">传统 IPC：两次拷贝</text>
<rect x="30" y="82" width="180" height="60" rx="10" fill="#fffdf8" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="44" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b" text-anchor="start">发送方用户态</text>
<text x="44" y="128" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f" text-anchor="start">Parcel / 数据</text>
<rect x="300" y="82" width="180" height="60" rx="10" fill="#fffdf8" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="314" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b" text-anchor="start">内核缓冲区</text>
<text x="314" y="128" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f" text-anchor="start">copy_from_user</text>
<rect x="570" y="82" width="180" height="60" rx="10" fill="#fffdf8" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="584" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b" text-anchor="start">接收方用户态</text>
<text x="584" y="128" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f" text-anchor="start">copy_to_user</text>
<line x1="210" y1="112" x2="296" y2="112" stroke="#d8532e" stroke-width="2" marker-end="url(#b)"/>
<line x1="480" y1="112" x2="566" y2="112" stroke="#d8532e" stroke-width="2" marker-end="url(#b)"/>
<text x="218" y="102" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#d8532e" text-anchor="start">第一次</text>
<text x="488" y="102" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#d8532e" text-anchor="start">第二次</text>
<text x="24" y="206" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2d55ff" text-anchor="start">Binder：一次 copy_from_user + mmap</text>
<rect x="30" y="222" width="180" height="60" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="44" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b" text-anchor="start">发送方用户态</text>
<text x="44" y="268" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f" text-anchor="start">Parcel / 数据</text>
<rect x="300" y="222" width="180" height="60" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="314" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b" text-anchor="start">接收方 buffer</text>
<text x="314" y="268" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f" text-anchor="start">内核分配</text>
<rect x="570" y="222" width="180" height="60" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="584" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b" text-anchor="start">接收方用户态</text>
<text x="584" y="268" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f" text-anchor="start">通过 mmap 访问</text>
<line x1="210" y1="252" x2="296" y2="252" stroke="#2d55ff" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="252" x2="566" y2="252" stroke="#2d55ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="218" y="242" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#2d55ff" text-anchor="start">拷贝一次</text>
<text x="488" y="242" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#2d55ff" text-anchor="start">mmap 映射</text>
<text x="30" y="338" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6f746f" text-anchor="start">“一次拷贝”不是零拷贝：大块数据仍受事务 buffer 限制，通常改用共享内存 / 图形缓冲。</text>
</svg>
