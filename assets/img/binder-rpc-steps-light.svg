<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240" role="img">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d55ff"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8532e"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fbf9f3"/>
<text x="24" y="30" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="18" font-weight="700" fill="#15181b" text-anchor="start">Binder 是 RPC：四个步骤</text>
<rect x="30" y="80" width="150" height="110" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="44" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2d55ff" text-anchor="start">1 / 定义</text>
<text x="44" y="136" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="16" font-weight="700" fill="#15181b" text-anchor="start">定义服务</text>
<text x="44" y="162" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6f746f" text-anchor="start">接口 + 实现</text>
<rect x="220" y="80" width="150" height="110" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="234" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2d55ff" text-anchor="start">2 / 注册</text>
<text x="234" y="136" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="16" font-weight="700" fill="#15181b" text-anchor="start">注册服务</text>
<text x="234" y="162" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6f746f" text-anchor="start">名字 → IBinder</text>
<rect x="410" y="80" width="150" height="110" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="424" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2d55ff" text-anchor="start">3 / 获取</text>
<text x="424" y="136" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="16" font-weight="700" fill="#15181b" text-anchor="start">获取代理</text>
<text x="424" y="162" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6f746f" text-anchor="start">handle / Proxy</text>
<rect x="600" y="80" width="150" height="110" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="614" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2d55ff" text-anchor="start">4 / 调用</text>
<text x="614" y="136" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="16" font-weight="700" fill="#15181b" text-anchor="start">transact</text>
<text x="614" y="162" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6f746f" text-anchor="start">Parcel → 驱动</text>
<line x1="182" y1="135" x2="216" y2="135" stroke="#2d55ff" stroke-width="2" marker-end="url(#a)"/>
<line x1="372" y1="135" x2="406" y2="135" stroke="#2d55ff" stroke-width="2" marker-end="url(#a)"/>
<line x1="562" y1="135" x2="596" y2="135" stroke="#2d55ff" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="218" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#6f746f" text-anchor="start">定义 → 注册 → 获取代理 → 发起调用；后面章节都围绕这四步展开。</text>
</svg>
