<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d55ff"/></marker></defs>
<rect width="100%" height="100%" fill="#fbf9f3"/>
<text x="24" y="30" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="18" font-weight="700" fill="#15181b">AIDL 生成代码：接口怎么变成 Proxy / Stub</text>
<rect x="30" y="80" width="160" height="72" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="42" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b">IServiceManager.aidl</text>
<text x="42" y="130" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f">接口 + 事务码</text>
<rect x="240" y="80" width="160" height="72" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="252" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b">Proxy.checkService</text>
<text x="252" y="130" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f">Parcel + transact</text>
<rect x="450" y="80" width="160" height="72" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="462" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b">Stub.onTransact</text>
<text x="462" y="130" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f">按 code 分发</text>
<rect x="630" y="80" width="120" height="72" rx="10" fill="#eef3ff" stroke="#d8d1c2" stroke-width="1.2"/>
<text x="642" y="108" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15181b">实际方法</text>
<text x="642" y="130" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6f746f">return</text>
<line x1="190" y1="116" x2="232" y2="116" stroke="#2d55ff" stroke-width="2" marker-end="url(#a)"/>
<line x1="400" y1="116" x2="442" y2="116" stroke="#2d55ff" stroke-width="2" marker-end="url(#a)"/>
<line x1="610" y1="116" x2="652" y2="116" stroke="#2d55ff" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="196" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#6f746f">AIDL 只描述接口；aidl 编译器生成 Proxy / Stub 和 Parcel 读写。</text>
<text x="30" y="220" font-family="Noto Sans SC, Noto Sans CJK SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#6f746f">调用时：Proxy 写入 -&gt; transact -&gt; 驱动 -&gt; Stub 读出并调用实际方法。</text>
</svg>
